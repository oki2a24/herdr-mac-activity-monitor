id = "localmac.activity-monitor"
name = "Activity Monitor"
version = "0.1.2"
min_herdr_version = "0.7.3"
description = "macOS 使用メモリ・バッテリーをHerdr popupに表示"
platforms = ["macos"]

[[panes]]
id = "monitor"
title = "Activity Monitor"
placement = "popup"
width = "80%"
height = 60
command = ["./bin/herdr-activity-monitor"]

[[actions]]
id = "toggle-monitor"
title = "Toggle Activity Monitor"
contexts = ["workspace"]
command = ["bash", "-c", "HERDR_BIN_PATH=\"${HERDR_BIN_PATH}\"; \"${HERDR_BIN_PATH}\" plugin pane open --plugin localmac.activity-monitor --entrypoint monitor"]
